<script>

const app = $('app');

const pages = {

      </div>
      <a href="#/quiz" class="inline-block bg-brand hover:bg-brand-dark text-white font-medium px-6 py-3 rounded-xl">Оставить заявку</a>
    </section>

    <section class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
      <div class="card rounded-2xl p-5"><h3 class="font-semibold mb-2">Вид на жительство</h3><p class="text-sm text-slate-600">Продление, смена параграфа, легализация.</p></div>
      <div class="card rounded-2xl p-5"><h3 class="font-semibold mb-2">Жильё</h3><p class="text-sm text-slate-600">Папка документов для арендодателя.</p></div>
      <div class="card rounded-2xl p-5"><h3 class="font-semibold mb-2">Работа</h3><p class="text-sm text-slate-600">Резюме и сопроводительные письма.</p></div>

      <div class="card rounded-2xl p-5"><h3 class="font-semibold mb-2">Переводчик</h3><p class="text-sm text-slate-600">Сопровождение на приём в ведомство.</p></div>
      <div class="card rounded-2xl p-5"><h3 class="font-semibold mb-2">Подтверждение диплома</h3><p class="text-sm text-slate-600">Помощь с признанием квалификации.</p></div>
    </section>

    <section class="mt-12">
      <h2 class="text-2xl font-bold mb-4">Частые вопросы</h2>
      <div class="space-y-3">
        <details class="card rounded-xl p-4"><summary class="font-medium cursor-pointer">Вы даёте юридические консультации?</summary><p class="mt-2 text-sm text-slate-600">Нет. Мы помогаем с организацией документов и походами в ведомства.</p></details>
        <details class="card rounded-xl p-4"><summary class="font-medium cursor-pointer">В каких городах работаете?</summary><p class="mt-2 text-sm text-slate-600">Singen, Landkreis Konstanz и в радиусе до 200 км.</p></details>
        <details class="card rounded-xl p-4"><summary class="font-medium cursor-pointer">Когда откроетесь?</summary><p class="mt-2 text-sm text-slate-600">В ближайшее время. Оставьте заявку — напишем вам первыми.</p></details>
      </div>
    </section>
  `,

  quiz: `
    <div class="max-w-lg mx-auto">
      <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-3 mb-4 text-sm text-center">
        Скоро запускаемся — заявки уже принимаем
      </div>
      <div class="card rounded-2xl p-6">
        <h2 class="text-2xl font-bold mb-1">Оставить заявку</h2>
        <p class="text-sm text-slate-500 mb-5">Ответьте на несколько вопросов</p>
        
        <form id="quizForm">
          <div class="step active space-y-4" data-step="1">
            <div>
              <label class="block text-sm font-medium mb-1">Имя</label>
              <input name="name" required class="w-full border rounded-lg px-3 py-2" placeholder="Ваше имя">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Город и PLZ</label>
              <input name="region" required class="w-full border rounded-lg px-3 py-2" placeholder="Например: 78224 Singen">
            </div>
            <button type="button" class="next w-full bg-brand text-white py-2.5 rounded-xl">Далее</button>
          </div>

          <div class="step space-y-4" data-step="2">
            <div>
              <label class="block text-sm font-medium mb-1">Услуга</label>
              <select name="category" required class="w-full border rounded-lg px-3 py-2">
                <option value="">Выберите</option>
                <option>Вид на жительство / легализация</option>
                <option>Поиск квартиры</option>
                <option>Резюме и работа</option>
                <option>Страховка на машину</option>
                <option>Переводчик / сопровождение</option>
                <option>Подтверждение диплома</option>
                <option>Другое</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Срочность</label>
              <select name="urgency" class="w-full border rounded-lg px-3 py-2">
                <option>Обычная</option>
                <option>Срочно</option>
              </select>
            </div>
            <div class="flex gap-2">
              <button type="button" class="prev flex-1 border py-2.5 rounded-xl">Назад</button>
              <button type="button" class="next flex-1 bg-brand text-white py-2.5 rounded-xl">Далее</button>
            </div>
          </div>

          <div class="step space-y-4" data-step="3">
            <div>
              <label class="block text-sm font-medium mb-1">Как связаться</label>
              <select name="contactMethod" class="w-full border rounded-lg px-3 py-2">
                <option>Telegram</option>
                <option>WhatsApp</option>
                <option>Телефон</option>
                <option>Email</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Контакт</label>
              <input name="contactValue" required class="w-full border rounded-lg px-3 py-2" placeholder="+49... или @username">
            </div>
            <div class="flex gap-2">
              <button type="button" class="prev flex-1 border py-2.5 rounded-xl">Назад</button>
              <button type="submit" class="flex-1 bg-brand text-white py-2.5 rounded-xl">Отправить</button>
            </div>
          </div>
        </form>
        <div id="success" class="hidden text-center py-10 text-brand font-medium text-lg">Заявка отправлена!<br><span class="text-sm font-normal text-slate-600">Мы свяжемся с вами.</span></div>
      </div>
    </div>
  `,

  impressum: `
    <div class="prose max-w-2xl mx-auto">
      <h2>Impressum</h2>
      <p><strong>Hegau Büroservice</strong><br>Andrii Havryschenko<br>Freiheitstrasse 59<br>78224 Singen</p>
      <p><strong>Kontakt</strong><br>E-Mail: andriihavryschenko@gmail.com</p>
      <p><strong>Angaben gemäß § 5 DDG</strong><br>Andrii Havryschenko<br>Freiheitstrasse 59<br>78224 Singen</p>
      <p><strong>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</strong><br>Andrii Havryschenko<br>Freiheitstrasse 59<br>78224 Singen</p>
    </div>
  `,

  datenschutz: `
    <div class="prose max-w-2xl mx-auto">
      <h2>Datenschutzerklärung</h2>
      <h3>1. Verantwortlicher</h3>
      <p>Andrii Havryschenko<br>Freiheitstrasse 59<br>78224 Singen<br>E-Mail: andriihavryschenko@gmail.com</p>
      <h3>2. Welche Daten wir erheben</h3>
      <p>Wenn Sie das Kontaktformular auf der Website nutzen, erheben wir folgende Daten:</p>
      <ul><li>Name</li><li>Kontakt (Telefon, Telegram, WhatsApp oder E-Mail)</li><li>Inhalt Ihrer Nachricht / Anfrage</li></ul>
      <h3>3. Zweck der Datenverarbeitung</h3>
      <p>Die Daten werden ausschließlich verwendet, um auf Ihre Anfrage zu antworten und die gewünschte Dienstleistung zu erbringen.</p>
      <h3>4. Rechtsgrundlage</h3>
      <p>Art. 6 Abs. 1 lit. b DSGVO (Vertrag / vorvertragliche Maßnahmen) und Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an der Beantwortung von Anfragen).</p>
      <h3>5. Speicherdauer</h3>
      <p>Die Daten werden gelöscht, sobald sie für die Zweckerfüllung nicht mehr erforderlich sind und keine gesetzlichen Aufbewahrungspflichten entgegenstehen.</p>
      <h3>6. Ihre Rechte</h3>
      <p>Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch.<br>Zur Ausübung Ihrer Rechte genügt eine E-Mail an andriihavryschenko@gmail.com.</p>
      <h3>7. Beschwerderecht</h3>
      <p>Sie haben das Recht, sich bei einer Datenschutzaufsichtsbehörde zu beschweren.</p>
    </div>
  `
};

function showPage() {
  const hash = location.hash || '#/';
  const page = hash.replace('#/', '') || 'home';
  app.innerHTML = pages[page] || pages.home;
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === hash || (hash === '#/' && a.getAttribute('href') === '#/')));
  if (page === 'quiz') initQuiz();
}

function initQuiz() {
  const form = $('quizForm');
  if (!form) return;
  let current = 1;
  const steps = form.querySelectorAll('.step');

  function go(n) {
    steps.forEach(s => s.classList.remove('active'));
    form.querySelector('[data-step="'+n+'"]').classList.add('active');
    current = n;
  }

  form.querySelectorAll('.next').forEach(btn => {
    btn.onclick = () => {
      const step = form.querySelector('.step.active');
      const inputs = step.querySelectorAll('[required]');
      let ok = true;
      inputs.forEach(i => { if (!i.value.trim()) ok = false; });
      if (ok) go(current + 1);
    };
  });
  form.querySelectorAll('.prev').forEach(btn => {
    btn.onclick = () => go(current - 1);
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Отправляем…';
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      const res = await fetch('/api/submit-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal
      });
      clearTimeout(timeout);
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.success !== false) {
        form.classList.add('hidden');
        $('success').classList.remove('hidden');
      } else {
        alert('Ошибка: ' + (data.error || 'сервер вернул ' + res.status));
        btn.disabled = false;
        btn.textContent = oldText;
      }
    } catch (err) {
      clearTimeout(timeout);
      alert(err.name === 'AbortError' ? 'Таймаут. Сервер не ответил.' : 'Ошибка соединения.');
      btn.disabled = false;
      btn.textContent = oldText;
    }
  };
}

window.addEventListener('hashchange', showPage);
showPage();
$('year').textContent = new Date().getFullYear();
</script>
</body>
